name: Feature request
description: Suggest a new capability or an improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please describe the problem first, then the proposed solution. Hardware-specific requests are
        easier to evaluate when you include the laptop model and the sensor values you expect.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing tools, workarounds or other designs you have tried.

  - type: input
    id: hardware
    attributes:
      label: Hardware (optional)
      placeholder: "Laptop model, CPU, dGPU"

  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: The proposal does not present an estimate as a real total-power reading.
          required: true
        - label: The proposal works without administrator privileges, or explains why elevation is unavoidable.
          required: true
